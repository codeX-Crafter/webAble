<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Overlapping enlarged text</title>
  <style>
    #first, #second { position: absolute; width: 240px; font-size: 16px; line-height: normal; }
    #first { top: 20px; padding-bottom: 30px; }
    #second { top: 71px; }
  </style>
</head>
<body>
  <nav aria-label="Primary">
    <a id="first" href="#first">First.</a>
    <a id="second" href="#second">Second.</a>
  </nav>
</body>
</html>
