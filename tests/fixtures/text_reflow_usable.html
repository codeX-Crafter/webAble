<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Usable text enlargement</title>
  <style>
    body { max-width: 48rem; margin: 2rem auto; padding: 1rem; }
    p { font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Readable page</h1>
  <p id="usable">This paragraph has room to wrap and grow when the text size increases.</p>
</body>
</html>
