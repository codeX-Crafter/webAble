<!doctype html>
<html>
<head><title>Flex and grid fixture</title></head>
<body style="margin: 0">
  <div id="flex-container" style="display: flex; width: 100%">
    <div id="flex-item" style="flex: 0 0 900px; height: 30px">Flex item</div>
  </div>
  <div id="grid-container" style="display: grid; grid-template-columns: 900px">
    <div id="grid-item" style="height: 30px">Grid item</div>
  </div>
</body>
</html>
